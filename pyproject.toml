[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "2.1.0"
description = "Recursive Introspection Engine — autonomous multi-perspective reasoning with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "websockets>=12.0",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
search = ["tavily-python>=0.5"]
local = ["langchain-ollama>=0.2"]
memory = ["sentence-transformers>=3.0"]
eval = ["matplotlib>=3.7"]
persist = ["langgraph-checkpoint-sqlite>=2.0"]

[tool.setuptools.packages.find]
include = ["ouroboros*"]
exclude = ["ouroboros.tests*"]

[tool.setuptools.package-data]
ouroboros = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ouroboros/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
